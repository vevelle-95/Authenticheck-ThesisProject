model:
  text_model: roberta-base
  image_model: resnet50
  clip_model: openai/clip-vit-base-patch32
  clip_revision: main
  embedding_dim: 256
  attention_heads: 4
  dropout: 0.1
  freeze_text_encoder: false
  freeze_image_encoder: true

training:
  batch_size: 2
  gradient_accumulation_steps: 2
  lr: 0.00002
  epochs: 5
  num_workers: 0
  device: auto
  mixed_precision: true
  seed: 42

data:
  csv: ../../data/test_reviews.csv
  splits: ../../data/splits_real_v2.json
  max_length: 128
  image_size: 224
  max_images: 5

output:
  checkpoint_dir: outputs/checkpoints
  model_cache: outputs/model_cache
  image_cache: outputs/image_cache
  clip_cache: outputs/clip_cache

